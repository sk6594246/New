<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratega PM — Project Management</title>
  <style>
    /* ============================================
       STRATEGA PM — Material Glass Design System
       ============================================ */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-hover: rgba(255, 255, 255, 0.14);
      --glass-active: rgba(255, 255, 255, 0.20);
      --text-primary: #e8ecf1;
      --text-secondary: #9aa5b8;
      --text-muted: #6b7a8f;
      --accent-blue: #4fc3f7;
      --accent-blue-dark: #29b6f6;
      --accent-green: #66bb6a;
      --accent-orange: #ffa726;
      --accent-red: #ef5350;
      --accent-purple: #ab47bc;
      --accent-teal: #26a69a;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.15);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.25);
      --shadow-lg: 0 16px 48px rgba(0,0,0,0.35);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-width: 260px;
      --header-height: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      background-image: 
        radial-gradient(ellipse at 10% 20%, rgba(79,195,247,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(171,71,188,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(15,23,42,1) 0%, rgba(8,12,24,1) 100%);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Glass Components */
    .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius-md); }
    .glass-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 8px 16px; color: var(--text-primary); cursor: pointer; transition: var(--transition); }
    .glass-btn:hover { background: var(--glass-hover); }
    .glass-btn.primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark)); border-color: transparent; }

    /* Layout & Loading */
    .app-shell { display: flex; height: 100vh; width: 100vw; }
    .main-content { flex: 1; padding: 24px; overflow-y: auto; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 3000; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 16px; }
    .status-badge.sheet { background: rgba(102,187,106,0.15); color: var(--accent-green); border: 1px solid rgba(102,187,106,0.3); }
    .status-badge.demo { background: rgba(255,167,38,0.15); color: var(--accent-orange); border: 1px solid rgba(255,167,38,0.3); }
  </style>

  <meta name="stratega-webapp-url" content="https://script.google.com/macros/s/AKfycbxsyBXNDDGA3Pwo6KzMfmw4kn2KBG6dewKA8i5UqbpDWqIiY43-2FHBzjMoeT6kwyOP6A/exec">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loadingText" class="loading-text">Checking Google Sheet for existing data...</div>
  </div>

  <div class="app-shell">
    <div class="main-content">
      <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
        <h2>Stratega PM Dashboard</h2>
        <button class="glass-btn primary" onclick="syncToGoogleSheet()">Sync Data to Sheet</button>
      </header>

      <div id="dataSourceBadge" class="status-badge demo">Data Source: Demo Data</div>

      <div class="glass" style="padding: 20px;">
        <h3>Projects Loaded</h3>
        <ul id="projectList" style="margin-top: 10px; padding-left: 20px;"></ul>
      </div>
    </div>
  </div>

  <script>
    // System State & Demo Fallback
    const CONFIG = {
      webAppUrl: document.querySelector('meta[name="stratega-webapp-url"]')?.content || ''
    };

    const DEMO_DATA = {
      projects: [
        { id: 'p1', name: 'Website Redesign', status: 'In Progress' },
        { id: 'p2', name: 'Mobile App Launch', status: 'Planning' }
      ],
      tasks: [
        { id: 't1', projectId: 'p1', title: 'Design Mockups', status: 'Completed' },
        { id: 't2', projectId: 'p1', title: 'API Integration', status: 'In Progress' }
      ]
    };

    let APP_STATE = {
      projects: [],
      tasks: [],
      source: 'none'
    };

    // Initialize Application
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
    });

    async function initApp() {
      showLoading(true, "Checking Google Sheet for data...");
      
      const sheetData = await fetchFromGoogleSheet();

      if (sheetData && hasValidData(sheetData)) {
        console.log("Sheet data found! Loading from Google Sheet...");
        APP_STATE.projects = sheetData.projects || [];
        APP_STATE.tasks = sheetData.tasks || [];
        APP_STATE.source = 'Google Sheet';
      } else {
        console.log("No valid Sheet data found. Falling back to Demo Data.");
        APP_STATE.projects = [...DEMO_DATA.projects];
        APP_STATE.tasks = [...DEMO_DATA.tasks];
        APP_STATE.source = 'Demo Data';
      }

      renderDashboard();
      showLoading(false);
    }

    // Fetch GET Endpoint
    async function fetchFromGoogleSheet() {
      if (!CONFIG.webAppUrl) return null;
      
      try {
        const response = await fetch(CONFIG.webAppUrl, { method: 'GET' });
        const result = await response.json();
        
        if (result.status === 'success' && result.data) {
          return result.data;
        }
      } catch (err) {
        console.warn("Unable to fetch from Google Sheet:", err);
      }
      return null;
    }

    // Verify if returned data is non-empty
    function hasValidData(data) {
      if (!data) return false;
      const hasProjects = Array.isArray(data.projects) && data.projects.length > 0;
      const hasTasks = Array.isArray(data.tasks) && data.tasks.length > 0;
      return hasProjects || hasTasks;
    }

    // Save/Sync POST Endpoint
    async function syncToGoogleSheet() {
      if (!CONFIG.webAppUrl) {
        alert("Web App URL not configured!");
        return;
      }
      showLoading(true, "Saving data to Google Sheet...");

      try {
        const payload = {
          projects: APP_STATE.projects,
          tasks: APP_STATE.tasks
        };

        const response = await fetch(CONFIG.webAppUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const res = await response.json();
        if (res.status === 'success') {
          alert('Successfully saved to Google Sheet!');
          APP_STATE.source = 'Google Sheet';
          renderDashboard();
        } else {
          alert('Failed to save data: ' + res.message);
        }
      } catch (err) {
        alert('Error saving data to sheet: ' + err.message);
      } finally {
        showLoading(false);
      }
    }

    // Render Views
    function renderDashboard() {
      const badge = document.getElementById('dataSourceBadge');
      badge.textContent = `Data Source: ${APP_STATE.source}`;
      badge.className = `status-badge ${APP_STATE.source === 'Google Sheet' ? 'sheet' : 'demo'}`;

      const projectList = document.getElementById('projectList');
      projectList.innerHTML = APP_STATE.projects
        .map(p => `<li><strong>${p.name}</strong> — <em>${p.status}</em></li>`)
        .join('');
    }

    function showLoading(show, text = "") {
      const overlay = document.getElementById('loadingOverlay');
      const textElem = document.getElementById('loadingText');
      if (text) textElem.textContent = text;
      overlay.style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
