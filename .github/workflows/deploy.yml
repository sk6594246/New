name: Deploy Stratega PM
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Web App URL
        run: |
          sed -i 's|__STRATEGA_WEBAPP_URL__|${{ secrets.STRATEGA_WEBAPP_URL }}|g' index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
